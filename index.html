 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simple Tasks</title>

  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d0e11;
      color: #F3F4F6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #root {
      width: 100%;
      max-width: 520px;
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #121316;
      position: relative;
    }

    @media (min-width: 600px) {
      #root {
        height: 92vh;
        max-height: 850px;
        border-radius: 16px;
        border: 1px solid #2E323D;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }
    }

    /* Splash Screen Overlay */
    .splash-screen {
      position: absolute;
      inset: 0;
      background-color: #121316;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-text-container {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .splash-welcome {
      color: #F3F4F6;
    }
    .splash-tasks {
      color: #10B981;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .splash-tasks.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Main App Layout */
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #2E323D;
      background-color: #181A1F;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    /* Daily Progress Bar */
    .progress-container {
      background-color: #262932;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #9CA3AF;
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background-color: #121316;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #059669, #10B981);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* Task List */
    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #2E323D;
    }
    .section-title.overdue {
      color: #EF4444;
    }
    .section-title.active {
      color: #10B981;
    }

    .empty-state {
      text-align: center;
      color: #6B7280;
      margin-top: 40px;
      font-size: 14px;
    }

    /* Cleaned Up Minimal Task Card */
    .task-swipe-wrapper {
      position: relative;
      margin-bottom: 8px;
      border-radius: 8px;
      overflow: hidden;
    }
    .task-swipe-wrapper.is-subtask {
      margin-left: 24px;
      margin-bottom: 6px;
    }

    .task-item {
      display: flex;
      align-items: center;
      background-color: #1E2026;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2E323D;
      transition: background-color 0.2s ease;
    }
    .is-subtask .task-item {
      background-color: #16181D;
    }
    .task-item.is-overdue-card {
      border-color: rgba(239, 68, 68, 0.4);
    }

    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid #10B981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .checkbox:active {
      transform: scale(0.85);
    }
    .checkbox.completed {
      background-color: #10B981;
    }
    .checkmark {
      color: #000;
      font-size: 11px;
      font-weight: bold;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }
    .task-title {
      font-size: 14px;
      color: #F3F4F6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-title.completed {
      color: #6B7280;
      text-decoration: line-through;
    }

    .task-meta {
      font-size: 11px;
      color: #6B7280;
      margin-top: 2px;
    }

    /* Action Buttons */
    .task-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn {
      background: none;
      border: 1px solid #2E323D;
      color: #9CA3AF;
      border-radius: 4px;
      font-size: 11px;
      padding: 3px 6px;
      cursor: pointer;
    }
    .action-btn:hover {
      border-color: #10B981;
      color: #10B981;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #6B7280;
      font-size: 15px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .delete-btn:hover {
      color: #EF4444;
    }

    /* Input Dock */
    .input-bar {
      padding: 12px 16px;
      background-color: #181A1F;
      border-top: 1px solid #2E323D;
      display: flex;
      gap: 8px;
    }
    .task-input {
      flex: 1;
      background-color: #121316;
      border: 1px solid #2E323D;
      color: #F3F4F6;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .task-input:focus {
      border-color: #10B981;
    }
    .add-btn {
      background-color: #10B981;
      border: none;
      color: #000;
      font-weight: 700;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .add-btn:active {
      transform: scale(0.96);
    }

  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>

</body>
</html>
